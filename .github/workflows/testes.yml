name: Testes do robô (sem banco de verdade)

# Roda o worker com banco e Storage FALSOS e ffmpeg real. Não usa segredo nenhum.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Testar o worker
        run: python tests/teste_worker.py
